name: elderly_ai_assistant
description: 云栖码梦 - 适老化 AI 辅助智能体 App（老人端 + 家属端）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  speech_to_text: ^7.5.0
  flutter_tts: ^4.0.2
  image_picker: ^1.0.7
  image_cropper: ^9.1.0
  fl_chart: ^0.66.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  file_picker: ^8.0.2
  path_provider: ^2.1.2
  audioplayers: ^6.1.0
  record: ^7.1.2
  open_filex: ^4.7.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/assistant.png
    - assets/assistant_face.png
    - assets/avatars/avatar1.png
    - assets/avatars/avatar2.png
    - assets/avatars/avatar3.png
    - assets/avatars/avatar4.png
